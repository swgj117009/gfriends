name: Manual Zip and Release

# 只保留手动触发
on:
  workflow_dispatch: 

# 必须声明写入权限，才能创建 Release
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get current date
        id: date
        # 获取当前时间，格式如：2026-10-25-1530
        run: echo "NOW=$(date +'%Y-%m-%d-%H%M')" >> $GITHUB_ENV

      - name: Create ZIP archive
        # 打包，并排除 .git 等隐藏文件
        run: zip -r "source-code-${{ env.NOW }}.zip" . -x "*.git*"

      - name: Create Release and Upload ZIP
        uses: softprops/action-gh-release@v2
        with:
          # 使用时间作为 Tag 名称，例如 v2026-10-25-1530
          tag_name: "v${{ env.NOW }}"
          name: "手动打包 v${{ env.NOW }}"
          body: "🤖 由 GitHub Actions 手动触发生成的代码快照。"
          files: source-code-${{ env.NOW }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
